<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='ui_patient_data_observer.css') }}">
</head>

<body>
    <div class="container">
        <div class="controls">
            <div class="slider-container">
                <span class="slider-label" id="pageLabel">Page</span>
                <input type="range" id="pageSlider" min="0" max="0" value="0">
                <button id="btnPrev">&lt;</button>
                <button id="btnNext">&gt;</button>
                <label class="toggle-switch">
                    <input type="checkbox" id="toggleEarliest">
                    <span class="toggle-slider"></span>
                    <span class="toggle-text">Earliest</span>
                </label>
                <label class="toggle-switch">
                    <input type="checkbox" id="toggleLatest">
                    <span class="toggle-slider"></span>
                    <span class="toggle-text">Latest</span>
                </label>
                <button id="btnSave" disabled>Save</button>
                <div id="saveProgress" class="save-progress" role="status" aria-live="polite" hidden>
                    <span>Saving all edited segments…</span>
                    <span class="save-progress-track"><span class="save-progress-bar"></span></span>
                </div>
                <span id="saveStatus" class="save-status" role="status" aria-live="polite"></span>
                <label class="toggle-switch">
                    <input type="checkbox" id="toggleFullHue" checked>
                    <span class="toggle-slider"></span>
                    <span class="toggle-text">Full HSV</span>
                </label>
                <img class="hsv-color-wheel" src="demo/hsv_color_wheel.png" alt="HSV color wheel">
            </div>
        </div>
        
        <div class="visualization-container">
            <div class="plot-3d-wrapper">
                <div id="mesh_and_electrode" class="plot-3d"></div>
            </div>
            <div class="egm-section">
                <div class="egm-with-inputs">
                    <div id="plot_electrograms" class="plot-egm"></div>
                    <div id="inputs_activation_times" class="input-container"></div>
                </div>
                <div class="plot-bottom-control plot-bottom-control-right">
                    <form id="woiControls" class="woi-controls">
                        <label for="woiStart">WOI start</label>
                        <input type="text" id="woiStart" class="woi-input" inputmode="numeric">
                        <label for="woiEnd">WOI end</label>
                        <input type="text" id="woiEnd" class="woi-input" inputmode="numeric">
                        <label for="cycleLength">Cycle length</label>
                        <input type="text" id="cycleLength" class="woi-input" inputmode="decimal">
                        <span class="input-unit">ms</span>
                        <span id="woiStatus" class="woi-status" role="status" aria-live="polite"></span>
                    </form>
                    <label class="toggle-switch">
                        <input type="checkbox" id="toggleInterpolateMesh">
                        <span class="toggle-slider"></span>
                        <span class="toggle-text">Interpolate to Mesh</span>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let appData = null;
        let currentSegmentIndex = 0;
        let electrogramRequestId = 0;
        let interpolationRequestId = 0;
        const editedSegmentIds = new Set();
        let isSaving = false;
        let isUpdatingWoi = false;

        function setSaveStatus(message, type = '') {
            const status = document.getElementById('saveStatus');
            status.textContent = message;
            status.className = `save-status${type ? ` save-status-${type}` : ''}`;
        }

        function updateSaveButton() {
            const saveButton = document.getElementById('btnSave');
            const editCount = editedSegmentIds.size;
            const hasInvalidActivation = Boolean(
                document.querySelector('.activation-input[aria-invalid="true"]')
            );
            saveButton.textContent = editCount > 0 ? `Save all (${editCount})` : 'Save';
            saveButton.disabled = !appData || isSaving || isUpdatingWoi
                || hasInvalidActivation || editCount === 0;
        }

        function setSavingState(saving) {
            isSaving = saving;
            document.getElementById('saveProgress').hidden = !saving;
            document.querySelectorAll('.activation-input').forEach(input => {
                input.disabled = saving;
            });
            document.getElementById('toggleEarliest').disabled = saving;
            document.getElementById('toggleLatest').disabled = saving;
            document.getElementById('woiStart').disabled = saving;
            document.getElementById('woiEnd').disabled = saving;

            if (saving) {
                setSliderEnabled(false);
            } else {
                const sortedView = document.getElementById('toggleEarliest').checked
                    || document.getElementById('toggleLatest').checked;
                setSliderEnabled(!sortedView);
            }
            updateSaveButton();
        }

        function getCurrentSegmentPositions() {
            if (!appData || !Array.isArray(appData.electrode_positions)) return [];
            return appData.electrode_positions[currentSegmentIndex] || [];
        }
        function getAllSegmentPositions() {
            if (!appData || !Array.isArray(appData.electrode_positions)) return [];
            const all = [];
            for (let s = 0; s < appData.segment_count; s++) {
                const seg = appData.electrode_positions[s] || [];
                for (let i = 0; i < seg.length; i++) all.push(seg[i]);
            }
            return all;
        }

        function getCurrentActivation() {
            if (!appData || !Array.isArray(appData.activation_uni)) return [];
            return appData.activation_uni[currentSegmentIndex] || [];
        }

        function getAllActivations() {
            if (!appData || !Array.isArray(appData.activation_uni)) return [];
            const all = [];
            for (let s = 0; s < appData.segment_count; s++) {
                const segPos = appData.electrode_positions?.[s];
                if (segPos === null || segPos === undefined || !Array.isArray(segPos) || segPos.length === 0) {
                    continue;
                }
                const seg = appData.activation_uni[s] || [];
                for (let i = 0; i < seg.length; i++) {
                    const v = seg[i];
                    all.push((v === null || v === undefined || !Number.isFinite(v)) ? 0 : v);
                }
            }
            return all;
        }
        // Load data on page load
        async function loadData() {
            const response = await fetch('/api/data');
            appData = await response.json();
            if (!response.ok) {
                throw new Error(appData.error || `HTTP ${response.status}`);
            }

            if (appData.segment_count > 0) {
                currentSegmentIndex = 0;
            }

            initializeSlider();
            document.getElementById('woiStart').value = appData.clinical_electrogram_woi_start;
            document.getElementById('woiEnd').value = appData.clinical_electrogram_woi_end;
            const cycleLength = Number(appData.median_cycle_length);
            document.getElementById('cycleLength').value = Number.isFinite(cycleLength) && cycleLength > 0
                ? (Number.isInteger(cycleLength) ? cycleLength : cycleLength.toFixed(1))
                : '';
            render3DPlot();
            renderElectrogram();
            updateSaveButton();
        }

        async function fetchElectrogramData(segmentId) {
            const response = await fetch('/api/electrograms', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ segment_id: segmentId })
            });
            const payload = await response.json();
            if (!response.ok) {
                throw new Error(payload.error || `HTTP ${response.status}`);
            }
            return payload;
        }

        function getActivationColor(norm, fullHue = document.getElementById('toggleFullHue').checked) {
            const clampedNorm = Math.max(0, Math.min(1, norm));
            const hue = fullHue ? clampedNorm : clampedNorm * (240.0 / 360.0);
            const saturation = 0.9;
            const value = 0.96;

            const c = value * saturation;
            const x = c * (1 - Math.abs(((hue * 6) % 2) - 1));
            const m = value - c;

            let r, g, b;
            const h = hue * 6;
            if (h < 1) {
                [r, g, b] = [c, x, 0];
            } else if (h < 2) {
                [r, g, b] = [x, c, 0];
            } else if (h < 3) {
                [r, g, b] = [0, c, x];
            } else if (h < 4) {
                [r, g, b] = [0, x, c];
            } else if (h < 5) {
                [r, g, b] = [x, 0, c];
            } else {
                [r, g, b] = [c, 0, x];
            }

            r = Math.round((r + m) * 255);
            g = Math.round((g + m) * 255);
            b = Math.round((b + m) * 255);
            return `rgb(${r},${g},${b})`;
        }

        function computeColors(activation, rangeOverride = null) {
            const validActivations = activation.filter(a => a !== 0 && Number.isFinite(a));
            if (validActivations.length === 0) {
                return activation.map(() => 'rgb(128,128,128)');
            }

            const range = rangeOverride || {
                min: Math.min(...validActivations),
                max: Math.max(...validActivations)
            };
            const minVal = range.min;
            const maxVal = range.max;
            const span = Math.max(maxVal - minVal, 1e-9);
            const fullHue = document.getElementById('toggleFullHue').checked;
            const cycleLength = Number(appData?.median_cycle_length);

            return activation.map(act => {
                if (act === 0 || !Number.isFinite(act)) {
                    return 'rgb(128,128,128)';
                }

                if (fullHue && Number.isFinite(cycleLength) && cycleLength > 0) {
                    const phase = ((act - minVal) / cycleLength % 1 + 1) % 1;
                    return getActivationColor(phase, true);
                }
                return getActivationColor((act - minVal) / span);
            });
        }

        function getActivationRange(activation) {
            const valid = activation.filter(value => value !== 0 && Number.isFinite(value));
            if (valid.length === 0) return { min: 0, max: 1 };
            const min = Math.min(...valid);
            const max = Math.max(...valid);
            return { min, max: max === min ? min + 1 : max };
        }

        function getGlobalActivationRange() {
            return getActivationRange(getAllActivations());
        }

        function getActivationColorscale() {
            const fullHue = document.getElementById('toggleFullHue').checked;
            // HSV is piecewise linear in RGB between hue-sector boundaries.
            const sectorCount = fullHue ? 6 : 4;
            return Array.from({ length: sectorCount + 1 }, (_, index) => {
                const position = index / sectorCount;
                return [position, getActivationColor(position, fullHue)];
            });
        }

        function getMeshColorSettings(meshActivation, meshPhase, activationRange) {
            const fullHue = document.getElementById('toggleFullHue').checked;
            if (fullHue) {
                return {
                    intensity: meshPhase.map(() => 0),
                    colorscale: [[0, 'rgb(160,160,160)'], [1, 'rgb(160,160,160)']],
                    cmin: 0,
                    cmax: 1,
                    vertexcolor: meshPhase.map(value => value === null || !Number.isFinite(value)
                        ? 'rgb(160,160,160)'
                        : getActivationColor(value, true))
                };
            }

            const hasValues = meshActivation.some(value => value !== null);
            if (!hasValues) {
                return {
                    intensity: meshActivation.map(() => 0),
                    colorscale: [[0, 'rgb(160,160,160)'], [1, 'rgb(160,160,160)']],
                    cmin: 0,
                    cmax: 1,
                    vertexcolor: null
                };
            }

            const span = Math.max(1e-9, activationRange.max - activationRange.min);
            const maskedValue = activationRange.min - span;
            const activationScale = getActivationColorscale();
            return {
                intensity: meshActivation.map(value => value === null ? maskedValue : value),
                colorscale: [
                    [0.0, 'rgb(160,160,160)'],
                    [0.5, 'rgb(160,160,160)'],
                    ...activationScale.map(([position, color]) => [0.5 + 0.5 * position, color])
                ],
                cmin: maskedValue,
                cmax: activationRange.max,
                vertexcolor: null
            };
        }

        function interpolateMeshActivation(activation) {
            return appData.mesh_activation || appData.mesh_vertex.map(() => null);
        }

        function interpolateMeshPhase() {
            return appData.mesh_phase || appData.mesh_vertex.map(() => null);
        }

        async function refreshMeshInterpolation() {
            const requestId = ++interpolationRequestId;
            const payloadBody = {
                activation_all: getAllActivations(),
                full_hsv: document.getElementById('toggleFullHue').checked,
                cycle_length: appData.median_cycle_length
            };
            const response = await fetch('/api/interpolate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payloadBody)
            });
            const payload = await response.json();
            if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
            if (requestId !== interpolationRequestId) return;
            if (payloadBody.full_hsv) {
                if (!Array.isArray(payload.mesh_phase)
                        || payload.mesh_phase.length !== appData.mesh_vertex.length) {
                    throw new Error('Full HSV phase data is missing; restart the Python server.');
                }
                appData.mesh_phase = payload.mesh_phase;
                appData.mesh_activation = appData.mesh_vertex.map(() => null);
            } else {
                appData.mesh_activation = payload.mesh_activation;
                appData.mesh_phase = appData.mesh_vertex.map(() => null);
            }
            if (payloadBody.full_hsv) {
                // Rebuild the mesh so Plotly switches cleanly from its initial
                // gray vertex colors to the returned circular-phase colors.
                render3DPlot(true);
            } else {
                update3DActivationColors();
            }
        }

        function splitElectrodesByActivation(activation, electrodePositions, range = null) {
            const colors = computeColors(activation, range);
            const activePosns = [], activeColors = [], inactivePosns = [];
            const inactiveColors = [];
            electrodePositions.forEach((pos, index) => {
                if (activation[index] !== 0 && Number.isFinite(activation[index])) {
                    activePosns.push(pos);
                    activeColors.push(colors[index]);
                } else {
                    inactivePosns.push(pos);
                    inactiveColors.push(colors[index]);
                }
            });
            return { activePosns, activeColors, inactivePosns, inactiveColors };
        }

        function update3DActivationColors() {
            const plot = document.getElementById('mesh_and_electrode');
            if (!plot.data) return;
            const activation = getCurrentActivation();
            const electrodePositions = getCurrentSegmentPositions();
            const allElectrodePositions = getAllSegmentPositions();
            const meshActivation = interpolateMeshActivation(activation);
            const meshPhase = interpolateMeshPhase();
            const range = getGlobalActivationRange();
            const meshColors = getMeshColorSettings(meshActivation, meshPhase, range);
            const showMesh = document.getElementById('toggleInterpolateMesh').checked;
            const { activePosns, activeColors, inactivePosns, inactiveColors } = splitElectrodesByActivation(activation, electrodePositions, range);

            // update mesh coloring
            const meshUpdate = meshColors.vertexcolor
                ? {
                    vertexcolor: [meshColors.vertexcolor],
                    intensity: [null],
                    colorscale: [null]
                }
                : {
                    vertexcolor: [null],
                    intensity: [meshColors.intensity],
                    colorscale: [meshColors.colorscale],
                    cmin: meshColors.cmin,
                    cmax: meshColors.cmax
                };
            Plotly.restyle(plot, meshUpdate, [0]);

            // update current-segment active/inactive electrodes
            Plotly.restyle(plot, {
                x: [activePosns.map(p => p[0])],
                y: [activePosns.map(p => p[1])],
                z: [activePosns.map(p => p[2])],
                'marker.color': [activeColors]
            }, [2]);
            Plotly.restyle(plot, {
                x: [inactivePosns.map(p => p[0])],
                y: [inactivePosns.map(p => p[1])],
                z: [inactivePosns.map(p => p[2])],
                'marker.color': [inactiveColors]
            }, [3]);
            // update other-segments electrodes (all electrodes except current segment)
            const currLen = electrodePositions.length;
            let startIndex = 0;
            for (let s = 0; s < currentSegmentIndex; s++) startIndex += (appData.electrode_positions[s] || []).length;
            const before = allElectrodePositions.slice(0, startIndex);
            const after = allElectrodePositions.slice(startIndex + currLen);
            const otherPosns = before.concat(after);
            const allActivations = getAllActivations();
            const otherActivations = allActivations.slice(0, startIndex).concat(allActivations.slice(startIndex + currLen));
            const {
                activePosns: otherActivePosns,
                activeColors: otherActiveColors,
                inactivePosns: otherInactivePosns,
                inactiveColors: otherInactiveColors
            } = splitElectrodesByActivation(otherActivations, otherPosns, range);
            Plotly.restyle(plot, {
                x: [otherActivePosns.map(p => p[0])],
                y: [otherActivePosns.map(p => p[1])],
                z: [otherActivePosns.map(p => p[2])],
                'marker.color': [otherActiveColors]
            }, [4]);
            Plotly.restyle(plot, {
                x: [otherInactivePosns.map(p => p[0])],
                y: [otherInactivePosns.map(p => p[1])],
                z: [otherInactivePosns.map(p => p[2])],
                'marker.color': [otherInactiveColors]
            }, [5]);

        }

        function render3DPlot(preserveCamera = false) {
            const activation = getCurrentActivation();
            const electrodePositions = getCurrentSegmentPositions();
            const meshActivation = interpolateMeshActivation(activation);
            const meshPhase = interpolateMeshPhase();
            const activationRange = getGlobalActivationRange();
            const meshColors = getMeshColorSettings(meshActivation, meshPhase, activationRange);
            const showMesh = document.getElementById('toggleInterpolateMesh').checked;

            const meshVertices = appData.mesh_vertex || [];
            const meshFaces = appData.mesh_face || [];
            const meshEdges = appData.mesh_edge || [];
            const atriumTrace = {
                type: 'mesh3d',
                x: meshVertices.map(p => p[0]),
                y: meshVertices.map(p => p[1]),
                z: meshVertices.map(p => p[2]),
                i: meshFaces.map(face => face[0]),
                j: meshFaces.map(face => face[1]),
                k: meshFaces.map(face => face[2]),
                ...(meshColors.vertexcolor
                    ? { vertexcolor: meshColors.vertexcolor }
                    : {
                        intensity: meshColors.intensity,
                        intensitymode: 'vertex',
                        colorscale: meshColors.colorscale,
                        cmin: meshColors.cmin,
                        cmax: meshColors.cmax
                    }),
                opacity: 1,
                visible: showMesh,
                showscale: false,
                showlegend: false,
                hoverinfo: 'none',
            };

            const edgeX = [], edgeY = [], edgeZ = [];
            meshEdges.forEach(([start, end]) => {
                const startVertex = meshVertices[start];
                const endVertex = meshVertices[end];
                if (!startVertex || !endVertex) return;
                edgeX.push(startVertex[0], endVertex[0], null);
                edgeY.push(startVertex[1], endVertex[1], null);
                edgeZ.push(startVertex[2], endVertex[2], null);
            });
            const meshEdgeTrace = {
                type: 'scatter3d',
                mode: 'lines',
                x: edgeX,
                y: edgeY,
                z: edgeZ,
                line: { color: 'rgb(100,100,100)', width: 1 },
                opacity: 0.15,
                visible: showMesh,
                showlegend: false,
                hoverinfo: 'none',
            };

            const { activePosns, activeColors, inactivePosns, inactiveColors } = splitElectrodesByActivation(activation, electrodePositions, activationRange);
            const allElectrodePositions = getAllSegmentPositions();

            const electrodeActiveTrace = {
                type: 'scatter3d',
                mode: 'markers',
                x: activePosns.map(p => p[0]),
                y: activePosns.map(p => p[1]),
                z: activePosns.map(p => p[2]),
                marker: { size: 4, color: activeColors, opacity: 1 },
                showlegend: false, hoverinfo: 'none',
            };

            const electrodeInactiveTrace = {
                type: 'scatter3d',
                mode: 'markers',
                x: inactivePosns.map(p => p[0]),
                y: inactivePosns.map(p => p[1]),
                z: inactivePosns.map(p => p[2]),
                marker: { size: 2, color: inactiveColors, opacity: 0.1 },
                showlegend: false, hoverinfo: 'none',
            };

            // other segments (not the currently selected segment)
            const currLen = electrodePositions.length;
            let startIndex = 0;
            for (let s = 0; s < currentSegmentIndex; s++) startIndex += (appData.electrode_positions[s] || []).length;
            const before = allElectrodePositions.slice(0, startIndex);
            const after = allElectrodePositions.slice(startIndex + currLen);
            const otherPosns = before.concat(after);
            const allActivations = getAllActivations();
            const otherActivations = allActivations.slice(0, startIndex).concat(allActivations.slice(startIndex + currLen));
            const {
                activePosns: otherActivePosns,
                activeColors: otherActiveColors,
                inactivePosns: otherInactivePosns,
                inactiveColors: otherInactiveColors
            } = splitElectrodesByActivation(otherActivations, otherPosns, activationRange);

            const otherSegmentsActiveTrace = {
                type: 'scatter3d',
                mode: 'markers',
                x: otherActivePosns.map(p => p[0]),
                y: otherActivePosns.map(p => p[1]),
                z: otherActivePosns.map(p => p[2]),
                marker: { size: 2, color: otherActiveColors, opacity: 0.8 },
                showlegend: false, hoverinfo: 'none'
            };

            const otherSegmentsInactiveTrace = {
                type: 'scatter3d',
                mode: 'markers',
                x: otherInactivePosns.map(p => p[0]),
                y: otherInactivePosns.map(p => p[1]),
                z: otherInactivePosns.map(p => p[2]),
                marker: { size: 2, color: otherInactiveColors, opacity: 0.1 },
                showlegend: false, hoverinfo: 'none'
            };

            const labelTexts = electrodePositions.map((_, i) => i.toString());
            const electrodeLabelTrace = {
                type: 'scatter3d',
                mode: 'text',
                x: electrodePositions.map(p => p[0]),
                y: electrodePositions.map(p => p[1]),
                z: electrodePositions.map(p => p[2]),
                text: labelTexts,
                textposition: 'middle center',
                textfont: { size: 16, color: '#000000', family: 'Arial, sans-serif' },
                showlegend: false,
                hoverinfo: 'none',
            };

            const layout = {
                title: {
                    text: appData.name_prefix,
                    font: { size: 12 }
                },
                dragmode: 'orbit',
                scene: {
                    xaxis: { visible: false },
                    yaxis: { visible: false },
                    zaxis: { visible: false },
                    aspectmode: 'data'
                },
                margin: { l: 0, r: 0, t: 40, b: 0 },
                showlegend: true,
                legend: { x: 0, y: 1 },
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)'
            };

            if (preserveCamera && document.getElementById('mesh_and_electrode').data) {
                const mesh_and_electrode = document.getElementById('mesh_and_electrode');
                layout.scene.camera = mesh_and_electrode.layout.scene.camera;
            }

            Plotly.newPlot('mesh_and_electrode', [
                atriumTrace,
                meshEdgeTrace,
                electrodeActiveTrace,
                electrodeInactiveTrace,
                otherSegmentsActiveTrace,
                otherSegmentsInactiveTrace,
                electrodeLabelTrace
            ], layout, {
                responsive: true
            });
        }

        function validateActivationInput(input) {
            const rawValue = input.value.trim();
            const woiStart = appData.clinical_electrogram_woi_start;
            const woiEnd = appData.clinical_electrogram_woi_end;
            let value = 0;
            let message = '';

            if (input.validity.badInput) {
                message = 'Enter a whole number.';
            } else if (rawValue !== '') {
                value = Number(rawValue);
                if (!Number.isFinite(value) || !Number.isInteger(value)) {
                    message = 'Enter a whole number.';
                } else if (value !== 0 && (value < woiStart || value > woiEnd)) {
                    message = `Enter 0 or a value from ${woiStart} to ${woiEnd}.`;
                }
            }

            input.setCustomValidity(message);
            if (message) {
                input.setAttribute('aria-invalid', 'true');
            } else {
                input.removeAttribute('aria-invalid');
            }
            return { valid: message === '', value, message };
        }

        function renderCombinedInputs(electrodeIds) {
            if (!electrodeIds) {
                electrodeIds = Array.from({ length: getCurrentSegmentPositions().length }, (_, i) => i);
            }
            const container = document.getElementById('inputs_activation_times');
            container.innerHTML = '';

            const renderedSegmentId = currentSegmentIndex;
            const activation = getCurrentActivation();
            for (let i = electrodeIds.length - 1; i >= 0; i--) {
                const eId = electrodeIds[i];
                const row = document.createElement('div');
                row.className = 'activation-row';

                const label = document.createElement('div');
                label.className = 'activation-label';
                label.textContent = eId.toString();

                const uniInput = document.createElement('input');
                uniInput.type = 'number';
                uniInput.step = '1';
                uniInput.className = 'activation-input';
                uniInput.value = activation[eId] !== 0 && Number.isFinite(activation[eId]) ? activation[eId] : '';
                uniInput.placeholder = '-';
                uniInput.dataset.electrodeId = eId;
                uniInput.disabled = isSaving;

                uniInput.addEventListener('input', (e) => {
                    const electrodeId = parseInt(e.target.dataset.electrodeId);
                    const result = validateActivationInput(e.target);
                    if (!result.valid) {
                        setSaveStatus(`Electrode ${electrodeId}: ${result.message}`, 'error');
                        updateSaveButton();
                        return;
                    }

                    appData.activation_uni[renderedSegmentId][electrodeId] = result.value;
                    editedSegmentIds.add(renderedSegmentId);
                    setSaveStatus('Unsaved changes', 'pending');
                    updateSaveButton();
                });

                uniInput.addEventListener('change', (e) => {
                    const electrodeId = parseInt(e.target.dataset.electrodeId);
                    const result = validateActivationInput(e.target);
                    if (!result.valid) {
                        e.target.reportValidity();
                        updateSaveButton();
                        return;
                    }

                    appData.activation_uni[renderedSegmentId][electrodeId] = result.value;
                    editedSegmentIds.add(renderedSegmentId);
                    updateSaveButton();

                    const fullSegmentIds = Array.from({ length: getCurrentSegmentPositions().length }, (_, i) => i);
                    document.getElementById('toggleEarliest').checked = false;
                    document.getElementById('toggleLatest').checked = false;
                    setSliderEnabled(true);

                    render3DPlot(true);
                    renderCombinedInputs(fullSegmentIds);
                    renderElectrogram(fullSegmentIds);

                    if (document.getElementById('toggleInterpolateMesh').checked) {
                        refreshMeshInterpolation().catch(err => console.error('Interpolation failed:', err));
                    }
                });

                row.appendChild(label);
                row.appendChild(uniInput);
                container.appendChild(row);
            }
        }

        async function renderElectrogram(electrodeIds) {
            if (!electrodeIds) {
                electrodeIds = Array.from({ length: getCurrentSegmentPositions().length }, (_, i) => i);
            }

            const requestId = ++electrogramRequestId;
            const activationUni = getCurrentActivation();
            const shiftSpacing = 4;

            let electrogramData;
            try {
                electrogramData = await fetchElectrogramData(currentSegmentIndex);
            } catch (err) {
                if (requestId !== electrogramRequestId) {
                    return;
                }
                Plotly.newPlot('plot_electrograms', [], {
                    title: { text: `Failed to load electrograms: ${err.message}`, font: { size: 12 } },
                    margin: { l: 60, r: 20, t: 40, b: 40 }
                }, {
                    responsive: true
                });
                renderCombinedInputs(electrodeIds);
                return;
            }

            if (requestId !== electrogramRequestId) {
                return;
            }

            const egmUniData = electrogramData.egm_uni || [];
            const egmUniQrsSubtractedData = electrogramData.egm_uni_qrs_subtracted || [];
            const egmRefData = electrogramData.egm_ref || [];
            const referenceTraces = [];
            const originalTraces = [];
            const qrsSubtractedTraces = [];
            const activationTraces = [];
            const yTickVals = [];
            const yTickText = [];
            let minY = Infinity;
            let maxY = -Infinity;

            for (let i = 0; i < electrodeIds.length; i++) {
                const eId = electrodeIds[i];
                const egmUni = egmUniData[eId];
                if (!Array.isArray(egmUni) || egmUni.length === 0) {
                    continue;
                }

                const t = egmUni.map((_, idx) => idx);
                const egmUniShifted = egmUni.map(val => val + i * shiftSpacing);
                const visibleSignals = [egmUniShifted];

                if (Array.isArray(egmRefData[eId]) && egmRefData[eId].length > 0) {
                    const egmRef = egmRefData[eId];
                    const egmRefShifted = egmRef.map(val => val + i * shiftSpacing);
                    visibleSignals.push(egmRefShifted);
                    referenceTraces.push({
                        type: 'scatter',
                        mode: 'lines',
                        x: t,
                        y: egmRefShifted,
                        line: { color: 'cyan', width: 1 },
                        opacity: 0.7,
                        showlegend: false,
                    });
                }

                originalTraces.push({
                    type: 'scatter',
                    mode: 'lines',
                    x: t,
                    y: egmUniShifted,
                    line: { color: 'magenta', width: 1 },
                    showlegend: false,
                    hovertemplate: `Time: %{x}<br><extra></extra>`
                });

                if (Array.isArray(egmUniQrsSubtractedData[eId]) && egmUniQrsSubtractedData[eId].length > 0) {
                    const egmUniQrsSubtracted = egmUniQrsSubtractedData[eId];
                    const egmUniQrsSubtractedShifted = egmUniQrsSubtracted.map(val => val + i * shiftSpacing);
                    visibleSignals.push(egmUniQrsSubtractedShifted);
                    qrsSubtractedTraces.push({
                        type: 'scatter',
                        mode: 'lines',
                        x: t,
                        y: egmUniQrsSubtractedShifted,
                        line: { color: 'blue', width: 2 },
                        showlegend: false,
                        hovertemplate: `Time: %{x}<br><extra></extra>`
                    });
                }

                const egmUniQrsSubtracted = egmUniQrsSubtractedData[eId];
                if (Array.isArray(egmUniQrsSubtracted)
                        && activationUni[eId] !== 0
                        && Number.isFinite(activationUni[eId])
                        && activationUni[eId] < egmUniQrsSubtracted.length) {
                    const actTime = activationUni[eId];
                    const actValue = egmUniQrsSubtracted[actTime] + i * shiftSpacing;
                    activationTraces.push({
                        type: 'scatter',
                        mode: 'markers',
                        x: [actTime],
                        y: [actValue],
                        marker: {
                            symbol: 'circle',
                            size: 8,
                            color: 'red',
                            opacity: 0.7
                        },
                        showlegend: false,
                    });
                }

                for (const signal of visibleSignals) {
                    minY = Math.min(minY, ...signal);
                    maxY = Math.max(maxY, ...signal);
                }
                yTickVals.push(i * shiftSpacing);
                yTickText.push(eId.toString());
            }

            const traces = [
                ...referenceTraces,
                ...originalTraces,
                ...qrsSubtractedTraces,
                ...activationTraces
            ];

            if (traces.length === 0 || !Number.isFinite(minY) || !Number.isFinite(maxY)) {
                Plotly.newPlot('plot_electrograms', [], {
                    title: { text: 'No electrogram data to display', font: { size: 12 } },
                    margin: { l: 60, r: 20, t: 40, b: 40 }
                }, {
                    responsive: true
                });
                renderCombinedInputs(electrodeIds);
                return;
            }

            const layout = {
                title: {
                    text: 'cyan: reference, magenta: original, blue: QRS-subtracted',
                    font: { size: 12 }
                },
                xaxis: {
                    showgrid: true,
                    zeroline: false
                },
                yaxis: {
                    tickvals: yTickVals,
                    ticktext: yTickText,
                    showgrid: false,
                    range: [minY, maxY]
                },
                margin: { l: 60, r: 20, t: 40, b: 40 },
                hovermode: 'closest',
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                shapes: [
                    {
                        type: 'line',
                        x0: appData.clinical_electrogram_woi_start, x1: appData.clinical_electrogram_woi_start,
                        y0: minY, y1: maxY,
                        yref: 'y',
                        line: { color: 'green', width: 1 }
                    },
                    {
                        type: 'line',
                        x0: appData.clinical_electrogram_woi_end, x1: appData.clinical_electrogram_woi_end,
                        y0: minY, y1: maxY,
                        yref: 'y',
                        line: { color: 'green', width: 1 }
                    }
                ]
            };

            Plotly.newPlot('plot_electrograms', traces, layout, {
                responsive: true
            });

            renderCombinedInputs(electrodeIds);
        }

        function initializeSlider() {
            const slider = document.getElementById('pageSlider');
            slider.max = Math.max(appData.segment_count - 1, 0);
            slider.value = currentSegmentIndex;
            updateSliderLabel();
        }

        function updateSliderLabel() {
            const segmentLabel = appData.segment_count > 0 ? `${currentSegmentIndex + 1}/${appData.segment_count}` : '0/0';
            document.getElementById('pageLabel').textContent = `Segment ${segmentLabel}`;
        }

        function navigateSegments(segmentIndex) {
            if (!appData || appData.segment_count === 0) return;
            currentSegmentIndex = segmentIndex;
            if (currentSegmentIndex < 0) currentSegmentIndex = appData.segment_count - 1;
            if (currentSegmentIndex >= appData.segment_count) currentSegmentIndex = 0;

            const slider = document.getElementById('pageSlider');
            slider.value = currentSegmentIndex;

            updateSliderLabel();
            render3DPlot(true);
            renderElectrogram();
        }

        document.getElementById('pageSlider').addEventListener('input', (e) => {
            navigateSegments(parseInt(e.target.value));
        });

        document.getElementById('btnPrev').addEventListener('click', () => {
            const slider = document.getElementById('pageSlider');
            let currentPage = parseInt(slider.value);
            if (currentPage > 0) {
                currentPage = currentPage - 1;
            } else {
                currentPage = Math.max(parseInt(slider.max), 0);
            }
            slider.value = currentPage;
            navigateSegments(currentPage);
        });

        document.getElementById('btnNext').addEventListener('click', () => {
            const slider = document.getElementById('pageSlider');
            let currentPage = parseInt(slider.value);
            if (currentPage < parseInt(slider.max)) {
                currentPage = currentPage + 1;
            } else {
                currentPage = 0;
            }
            slider.value = currentPage;
            navigateSegments(currentPage);
        });

        function setSliderEnabled(enabled) {
            document.getElementById('pageSlider').disabled = !enabled;
            document.getElementById('btnPrev').disabled = !enabled;
            document.getElementById('btnNext').disabled = !enabled;
        }

        function showSortedElectrodes(order) {
            if (!appData || appData.segment_count === 0) return;
            const activation = getCurrentActivation();
            const validIndices = activation
                .map((a, i) => ({ id: i, val: a }))
                .filter(x => x.val !== 0 && Number.isFinite(x.val));
            if (validIndices.length === 0) {
                render3DPlot(true);
                renderElectrogram();
                return;
            }
            if (order === 'earliest') {
                validIndices.sort((a, b) => a.val - b.val);
            } else {
                validIndices.sort((a, b) => b.val - a.val);
            }
            const ids = validIndices.slice(0, Math.min(validIndices.length, appData.segment_electrode_count)).map(x => x.id);
            render3DPlot(true);
            renderElectrogram(ids);
        }

        function findSegmentForOrder(order) {
            // Search across all segments for the global earliest/latest activation
            const all = getAllActivations();
            const valid = all
                .map((v, i) => ({ val: v, idx: i }))
                .filter(x => x.val !== 0 && Number.isFinite(x.val));
            if (valid.length === 0) return currentSegmentIndex;
            let chosen;
            if (order === 'earliest') {
                chosen = valid.reduce((a, b) => (a.val <= b.val ? a : b));
            } else {
                chosen = valid.reduce((a, b) => (a.val >= b.val ? a : b));
            }
            // map flattened index back to segment index
            let flat = chosen.idx;
            for (let s = 0; s < appData.segment_count; s++) {
                const segLen = (appData.electrode_positions[s] || []).length;
                if (flat < segLen) return s;
                flat -= segLen;
            }
            return currentSegmentIndex;
        }

        document.getElementById('toggleEarliest').addEventListener('change', (e) => {
            if (e.target.checked) {
                document.getElementById('toggleLatest').checked = false;
                setSliderEnabled(false);
                // find the segment containing the global earliest activation and navigate there
                const targetSeg = findSegmentForOrder('earliest');
                currentSegmentIndex = targetSeg;
                document.getElementById('pageSlider').value = currentSegmentIndex;
                updateSliderLabel();
                render3DPlot(true);
                renderElectrogram();
            } else {
                setSliderEnabled(true);
                navigateSegments(parseInt(document.getElementById('pageSlider').value));
            }
        });

        document.getElementById('toggleLatest').addEventListener('change', (e) => {
            if (e.target.checked) {
                document.getElementById('toggleEarliest').checked = false;
                setSliderEnabled(false);
                // find the segment containing the global latest activation and navigate there
                const targetSeg = findSegmentForOrder('latest');
                currentSegmentIndex = targetSeg;
                document.getElementById('pageSlider').value = currentSegmentIndex;
                updateSliderLabel();
                render3DPlot(true);
                renderElectrogram();
            } else {
                setSliderEnabled(true);
                navigateSegments(parseInt(document.getElementById('pageSlider').value));
            }
        });

        document.getElementById('toggleFullHue').addEventListener('change', () => {
            render3DPlot(true);
            if (document.getElementById('toggleInterpolateMesh').checked) {
                refreshMeshInterpolation().catch(err => console.error('Interpolation failed:', err));
            }
        });

        function updateCycleLength() {
            if (!appData) return false;

            const input = document.getElementById('cycleLength');
            const cycleLength = Number(input.value.trim());
            const isValid = Number.isFinite(cycleLength) && cycleLength > 0;
            input.setCustomValidity(isValid ? '' : 'Enter a cycle length greater than zero.');
            if (!isValid) {
                input.reportValidity();
                return false;
            }
            if (cycleLength === appData.median_cycle_length) return true;

            appData.median_cycle_length = cycleLength;
            render3DPlot(true);
            if (document.getElementById('toggleInterpolateMesh').checked) {
                refreshMeshInterpolation().catch(err => console.error('Interpolation failed:', err));
            }
            return true;
        }

        async function updateWindowOfInterest() {
            if (!appData || isSaving || isUpdatingWoi) return;

            const startInput = document.getElementById('woiStart');
            const endInput = document.getElementById('woiEnd');
            const status = document.getElementById('woiStatus');
            const woiStart = Number(startInput.value.trim());
            const woiEnd = Number(endInput.value.trim());

            if (!Number.isInteger(woiStart) || !Number.isInteger(woiEnd) || woiStart < 0 || woiStart >= woiEnd) {
                status.textContent = 'Enter integers with start < end.';
                status.className = 'woi-status woi-status-error';
                return;
            }
            if (woiStart === appData.clinical_electrogram_woi_start
                    && woiEnd === appData.clinical_electrogram_woi_end) {
                status.textContent = '';
                return;
            }

            isUpdatingWoi = true;
            updateSaveButton();
            startInput.disabled = true;
            endInput.disabled = true;
            status.textContent = 'Updating…';
            status.className = 'woi-status';

            try {
                const response = await fetch('/api/window-of-interest', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        clinical_electrogram_woi_start: woiStart,
                        clinical_electrogram_woi_end: woiEnd
                    })
                });
                const payload = await response.json();
                if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);

                appData.clinical_electrogram_woi_start = payload.clinical_electrogram_woi_start;
                appData.clinical_electrogram_woi_end = payload.clinical_electrogram_woi_end;
                appData.activation_uni = payload.activation_uni;
                appData.mesh_activation = appData.mesh_vertex.map(() => null);
                appData.mesh_phase = appData.mesh_vertex.map(() => null);
                for (let segmentId = 0; segmentId < appData.segment_count; segmentId++) {
                    editedSegmentIds.add(segmentId);
                }

                document.getElementById('toggleEarliest').checked = false;
                document.getElementById('toggleLatest').checked = false;
                setSliderEnabled(true);
                updateSaveButton();
                setSaveStatus('WOI and activations updated; unsaved changes.', 'pending');
                render3DPlot(true);
                renderElectrogram();

                if (document.getElementById('toggleInterpolateMesh').checked) {
                    refreshMeshInterpolation().catch(err => console.error('Interpolation failed:', err));
                }
                status.textContent = 'Updated';
                status.className = 'woi-status woi-status-success';
            } catch (err) {
                startInput.value = appData.clinical_electrogram_woi_start;
                endInput.value = appData.clinical_electrogram_woi_end;
                status.textContent = err.message;
                status.className = 'woi-status woi-status-error';
                console.error('Failed to update window of interest:', err);
            } finally {
                isUpdatingWoi = false;
                startInput.disabled = false;
                endInput.disabled = false;
                updateSaveButton();
            }
        }

        document.getElementById('woiControls').addEventListener('submit', (event) => {
            event.preventDefault();
            if (updateCycleLength()) updateWindowOfInterest();
        });
        document.getElementById('woiStart').addEventListener('change', updateWindowOfInterest);
        document.getElementById('woiEnd').addEventListener('change', updateWindowOfInterest);
        document.getElementById('cycleLength').addEventListener('input', (event) => {
            event.target.setCustomValidity('');
        });
        document.getElementById('cycleLength').addEventListener('change', updateCycleLength);

        document.getElementById('toggleInterpolateMesh').addEventListener('change', (e) => {
            const plot = document.getElementById('mesh_and_electrode');
            const showMesh = e.target.checked;
            Plotly.restyle(plot, { visible: showMesh }, [0, 1]);
            if (showMesh) {
                refreshMeshInterpolation().catch(err => console.error('Interpolation failed:', err));
            }
        });

        document.getElementById('btnSave').addEventListener('click', async () => {
            if (!appData || isSaving || editedSegmentIds.size === 0) return;

            const segmentIdsToSave = Array.from(editedSegmentIds).sort((a, b) => a - b);
            const segments = segmentIdsToSave.map(segmentId => ({
                segment_id: segmentId,
                activation_uni: appData.activation_uni[segmentId]
            }));

            setSaveStatus('');
            setSavingState(true);

            try {
                const response = await fetch('/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ segments })
                });
                const responseText = await response.text();
                let result = {};
                if (responseText) {
                    try {
                        result = JSON.parse(responseText);
                    } catch (_error) {
                        result = { error: `Server returned an invalid response (HTTP ${response.status})` };
                    }
                }
                if (!response.ok || result.status !== 'ok') {
                    throw new Error(result.error || `HTTP ${response.status}`);
                }
                segmentIdsToSave.forEach(segmentId => editedSegmentIds.delete(segmentId));
                const count = result.saved_segment_count ?? segmentIdsToSave.length;
                setSaveStatus(`Saved ${count} edited segment${count === 1 ? '' : 's'}.`, 'success');
            } catch (err) {
                console.error('Failed to save activation times:', err);
                setSaveStatus(`Save failed: ${err.message}`, 'error');
                alert(`Failed to save activation times: ${err.message}`);
            } finally {
                setSavingState(false);
            }
        });

        window.addEventListener('beforeunload', (event) => {
            if (editedSegmentIds.size > 0) {
                event.preventDefault();
                event.returnValue = '';
            }
        });

        loadData().catch(err => {
            const meshDiv = document.getElementById('mesh_and_electrode');
            const egmDiv = document.getElementById('plot_electrograms');
            meshDiv.textContent = `Failed to load data: ${err.message}`;
            egmDiv.textContent = 'See error above.';
            console.error(err);
        });
    </script>
</body>
</html>
